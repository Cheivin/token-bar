name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 跟随 go.mod，避免与本地构建版本漂移
          go-version-file: 'go.mod'

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build & package
        # 复用 Makefile 的 package 目标，产出两个独立 dmg（arm64 / amd64），
        # 各自带 /Applications 快捷方式，挂载后拖拽安装。
        # VERSION 传入 git tag 版本号，覆盖 Makefile 默认值，保证产物命名正确。
        # GCFLAGS 由 Makefile 内部处理（绕过 darwinkit #286 的 arm64 优化器 bug）。
        run: make package VERSION=${{ steps.version.outputs.VERSION }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
